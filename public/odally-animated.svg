<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Odally animated logo</title>
  <desc id="desc">The Odally wordmark appears, the underline slides in from the left, and the O makes a soft pop.</desc>
  <style>
    .ink { fill:#000; fill-rule:evenodd; }
    .word { opacity:0; animation: word-in .65s ease-out .12s forwards; }
    .underline { transform:translateX(-190px); opacity:0; animation: slide-in .85s cubic-bezier(.2,.75,.25,1) .18s forwards; }
    .letter-o { transform-box:view-box; transform-origin:118px 258px; opacity:0; animation: o-pop .8s cubic-bezier(.2,.85,.25,1) .42s forwards; }
    @keyframes word-in { to { opacity:1; } }
    @keyframes slide-in { 0% { transform:translateX(-190px); opacity:0; } 70% { opacity:1; } 100% { transform:translateX(0); opacity:1; } }
    @keyframes o-pop { 0% { opacity:0; transform:scale(.72); } 65% { opacity:1; transform:scale(1.08); } 100% { opacity:1; transform:scale(1); } }
    @media (prefers-reduced-motion: reduce) { .word,.underline,.letter-o { animation:none; opacity:1; transform:none; } }
  </style>
